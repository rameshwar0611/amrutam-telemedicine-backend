receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  attributes/privacy:
    # Defense in depth. Application instrumentation never collects these values.
    actions:
      - { key: db.statement, action: delete }
      - { key: db.query.text, action: delete }
      - { key: url.full, action: delete }
      - { key: http.url, action: delete }
      - { key: url.query, action: delete }
      - { key: exception.message, action: delete }
      - { key: exception.stacktrace, action: delete }
  batch: { timeout: 1s, send_batch_size: 256 }
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    retry_on_failure: { enabled: true, max_elapsed_time: 30s }
    sending_queue: { enabled: true, queue_size: 512 }
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: { enabled: true }
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  pipelines:
    traces:
      {
        receivers: [otlp],
        processors: [memory_limiter, attributes/privacy, batch],
        exporters: [otlphttp/tempo],
      }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] }
